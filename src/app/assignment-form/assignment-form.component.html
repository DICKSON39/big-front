<div class="form-container">
  <h2>Create Assignment</h2>
  <form [formGroup]="assignmentForm" (ngSubmit)="onSubmit($event)">
    <div>
      <label>Title</label>
      <input formControlName="title" type="text" placeholder="Enter title" />
    </div>

    <div>
      <label>Description</label>
      <textarea
        formControlName="description"
        placeholder="Enter description"
      ></textarea>
    </div>

    <div>
      <label>Due Date</label>
      <input formControlName="due_date" type="date" />
    </div>

    <div>
      <label>Course</label>
      <select formControlName="course_id">
        <option value="">-- Select Course --</option>
        <option *ngFor="let course of courses" [value]="course.id">
          {{ course.title }}
        </option>
      </select>
    </div>

    <!-- Optional: Upload file -->
    <div>
      <label>Attachment (optional)</label>
      <input type="file" (change)="onFileChange($event)" />
    </div>

    <div class="actions">
      <button type="submit" [disabled]="assignmentForm.invalid">Create</button>
      <button type="button" (click)="onClose()">Cancel</button>
    </div>
  </form>
</div>
