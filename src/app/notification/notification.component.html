<!-- 🔔 Notification Bell -->
<div class="notif-wrapper">
  <div class="notif-bell" (click)="toggleDropdown()">
    🔔
    <span *ngIf="unreadCount > 0" class="badge">{{ unreadCount }}</span>
  </div>

  <div class="notif-dropdown" *ngIf="dropdownOpen">
    <h4>🔔 Notifications</h4>
    <div *ngIf="notifications.length === 0" class="empty-state">
      🚫 No new notifications
    </div>
    <ul *ngIf="notifications.length > 0">
      <li *ngFor="let notif of notifications" [class.read]="notif.is_read">
        <span>{{ notif.message }}</span>
        <small>{{ notif.created_at | date: "short" }}</small>
        <button *ngIf="!notif.is_read" (click)="markAsRead(notif.id)">
          ✅ Mark Read
        </button>
      </li>
    </ul>
  </div>
</div>
