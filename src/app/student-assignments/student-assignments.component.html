<div *ngIf="assignments.length === 0" class="no-assignments-message">
  🚫 No assignments available for this course.
</div>

<div *ngFor="let a of assignments" class="assignment-card">
  <h3>{{ a.title }}</h3>
  <p>{{ a.description }}</p>
  <p>📅 Due: {{ a.due_date | date: 'mediumDate' }}</p>

  <ng-container *ngIf="a.submission; else submissionForm">
    <div
      class="status-box"
      [ngClass]="{
        'status-submitted': a.submission,
        'status-graded': a.submission?.grade
      }"
    >
      <span class="status-badge">
        <ng-container *ngIf="a.submission?.grade">Graded</ng-container>
        <ng-container *ngIf="!a.submission?.grade">Submitted</ng-container>
      </span>

      <p><strong>Grade:</strong> {{ a.submission?.grade || 'Pending' }}</p>
      <p><strong>Feedback:</strong> {{ a.submission?.feedback || 'N/A' }}</p>
      <a
        *ngIf="a.submission?.url"
        [href]="a.submission.url"
        target="_blank"
        class="submitted-link"
        >🔗 View Submission</a
      >

      <!-- 🔁 Resubmit + ❌ Delete -->
      <div class="submission-actions">
        <input
          [(ngModel)]="a.submissionUrl"
          placeholder="New submission link"
          class="submission-input"
        />
        <button
          class="submit-btn"
          (click)="resubmitAssignment(a.id, a.submissionUrl)"
          [disabled]="!a.submissionUrl"
        >
          🔁 Resubmit
        </button>
        <button class="delete-btn" (click)="deleteSubmission(a.id)">
          ❌ Delete
        </button>
      </div>
    </div>
  </ng-container>

  <ng-template #submissionForm>
    <input
      [(ngModel)]="a.submissionUrl"
      placeholder="Paste your submission link"
      class="submission-input"
    />
    <button
      (click)="submitAssignment(a.id, a.submissionUrl)"
      [disabled]="!a.submissionUrl"
      class="submit-btn"
    >
      📤 Submit
    </button>
  </ng-template>
</div>
