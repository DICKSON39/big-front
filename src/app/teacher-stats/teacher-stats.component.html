<div class="teacher-stats-container">
  <h2>📊 My Teaching Stats</h2>

  <div class="stat-card">
    <h3>Total Courses</h3>
    <p>{{ stats.total_courses ?? 0 }}</p>
  </div>

  <div class="stat-card">
    <h3>Total Enrolled Students</h3>
    <p>{{ stats.total_enrolled_students ?? 0 }}</p>
  </div>

  <div class="stat-card">
    <h3>Assignments Given</h3>
    <p>{{ stats.total_assignments_given ?? 0 }}</p>
  </div>

  <div class="stat-card">
    <h3>Certificates Uploaded</h3>
    <p>{{ stats.total_certificates_uploaded ?? 0 }}</p>
  </div>
</div>
