<div *ngIf="loading">Loading trending topics...</div>
<div *ngIf="error">{{ error }}</div>

<table *ngIf="!loading && !error" class="table">
  <thead>
    <tr>
      <th>#</th>
      <th>Topic</th>
      <th>Requests</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of trendingTopics; let i = index">
      <td>{{ i + 1 }}</td>
      <td>{{ item.topic }}</td>
      <td>{{ item.count }}</td>
    </tr>
  </tbody>
</table>
